# Add inside your mindtwistgames.com server { } block.
# Ensures visitors pick up new index.html (and new ?v= script URLs) without clearing cache.

location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
}

location = / {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
}

# Versioned assets (main.js?v=3, css/base.css?v=3) may be cached long-term.
# Bump ?v= in index.html and js imports on each release.
